<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0a2f24" />
    <title>CivilCraft</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- PostCSS 経由だと壊れる環境があるため、静的配信の Cesium CSS を直接読む -->
    <link rel="stylesheet" href="/cesiumStatic/Widgets/widgets.css" />
    <style>
      #boot-fallback {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #071018;
        color: #e8f1f6;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      #boot-fallback div { max-width: 360px; }
      #boot-fallback p { color: #9bb4c2; line-height: 1.6; }
      #boot-fallback button {
        padding: 10px 14px;
        border: 1px solid #80b5ca;
        border-radius: 4px;
        background: #163644;
        color: #e8f1f6;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <main id="boot-fallback" role="alert">
      <div>
        <h1>CivilCraft を起動しています</h1>
        <p>表示されない場合は、ページを再読み込みしてください。</p>
        <button type="button" onclick="window.location.reload()">再読み込み</button>
      </div>
    </main>
    <script>
      window.setTimeout(function () {
        var el = document.getElementById("boot-fallback");
        if (!el) return;
        var p = el.querySelector("p");
        if (p) {
          p.textContent = "読み込みが長引いています。再読み込みするか、開発サーバーを再起動してください。";
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
