<!doctype html><meta charset="utf-8"><title>Inland ponding comparison</title>
<!-- Development-only rendering comparison using bundled geography and the same
     simulation seed/time. Not observed flooding, pump physics or a mobile FPS test. -->
<style>body{font:15px system-ui;color:#163d4f;background:#edf7fa;margin:16px}main{display:flex;gap:12px;flex-wrap:wrap}section{width:360px}canvas{display:block;width:360px;height:420px}pre{white-space:pre-wrap}h2{font-size:18px}</style>
<h1>住宅地の浸水：同じ雨・同じ時刻で比較</h1><p>実地形上のゲーム内表現です。実測・災害予測ではありません。施設なし／排水機場あり、雨開始から90秒。</p><main></main><pre id="result">読み込み中</pre>
<script type="module">
import * as T from 'three';
import { loadKoriyamaScene } from '../../src/components/GameCanvas/loadKoriyamaScene.ts';
import { createGeographicTerrain } from '../../src/components/GameCanvas/geographicTerrain.ts';
import { createGeographicWorld } from '../../src/components/GameCanvas/geographicWorld.ts';
import { createRenderedWaterMask } from '../../src/components/GameCanvas/renderedWaterMask.ts';
import { createInlandPonding } from '../../src/components/GameCanvas/inlandPonding.ts';
import { geoToWorld } from '../../src/components/GameCanvas/dioramaSpace.ts';
import { disposeDioramaObject } from '../../src/components/GameCanvas/disposeDioramaObject.ts';
import { listOverflowCandidates } from '../../src/features/disaster/services/overflowBankSites.ts';
import { advanceFloodSimulation, beginDisaster, beginPreparation } from '../../src/features/disaster/services/floodSimulation.ts';
import { suggestedStructureHeading } from '../../src/features/disaster/services/hydraulicPlacement.ts';
try {
 const data=await loadKoriyamaScene(new AbortController().signal),terrain=createGeographicTerrain(data.terrain);
 const world=createGeographicWorld(data.osm,{plateau:data.plateau,localBounds:terrain.bounds,groundSampler:terrain.sampleGround,renderedTerrainSurface:terrain.renderedSurface,surfaceGridSpacing:12,provisionalBuildingHeight:6,
 surfaceSampler:(x,z,layer)=>{const y=['road','rail','campus'].includes(layer)?terrain.sampleRenderedGround(x,z):terrain.sampleGround(x,z);return y===null?null:y+(layer.startsWith('bridge-')?3:['water','waterway'].includes(layer)?.35:.12);}});
 const mask=createRenderedWaterMask(world.waterMeshes,terrain.bounds),scene=new T.Scene();scene.background=new T.Color('#b4dff1');scene.add(terrain.group,world);
 const sun=new T.DirectionalLight(0xfff9ef,2.5);sun.position.set(-200,500,-200);scene.add(sun,new T.HemisphereLight(0xd8efff,0x6c8291,.6));
 const site=listOverflowCandidates().find(s=>s.primaryHazard==='inlandPonding'),focus=geoToWorld(site.longitude,site.latitude),y=terrain.sampleRenderedGround(focus.x,focus.z);
 const camera=new T.PerspectiveCamera(42,360/420,1,5000);camera.position.set(focus.x+105,y+220,focus.z+180);camera.lookAt(focus.x,y,focus.z);
 const position={longitude:140.3790252355544,latitude:37.36042958969283,height:20};
 const pump={id:'pump',structureId:'drainage-pump',position,headingDegrees:suggestedStructureHeading('drainage-pump',position)},results=[];
 for(const [name,visible,withPump] of [['変更前：内水表示なし',false,false],['施設なし：浸水',true,false],['排水機場あり',true,true]]){
  const field=createInlandPonding({bounds:terrain.bounds,renderedSurface:terrain.renderedSurface,sampleGround:(x,z)=>terrain.sampleGround(x,z)===null?null:terrain.sampleRenderedGround(x,z),classifyWater:mask.classify,classifyFootprint:mask.classifyFootprint});
  scene.add(field.group);let state=beginDisaster(beginPreparation(),{weatherSeed:42601});field.update(state);
  for(let i=0;i<900;i++){state=advanceFloodSimulation(state,withPump?[pump]:[],.1);field.update(state);}
  field.group.visible=visible;
  const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=name;section.append(heading);document.querySelector('main').append(section);
  const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(360,420);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;section.append(renderer.domElement);
  let error=null;renderer.debug.onShaderError=()=>{error='Shader compilation failed';};renderer.render(scene,camera);
  results.push({name,areaM2:field.stats.areaM2,depth:state.floodDepthMeters,drawCalls:field.stats.drawCalls,error,glError:renderer.getContext().getError()});
  field.dispose();renderer.dispose();
 }
 document.querySelector('#result').textContent=JSON.stringify({results,pass:results.every(r=>!r.error&&!r.glError)&&results[1].areaM2>results[2].areaM2+500},null,2);
 disposeDioramaObject(scene);
}catch(error){document.querySelector('#result').textContent=String(error);}
</script>
