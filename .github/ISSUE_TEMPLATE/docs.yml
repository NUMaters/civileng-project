name: Documentation
description: 設計・運用ドキュメントの追加・更新
title: "docs: "
labels: ["documentation", "mvp"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何を文書化するか
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 想定ドキュメントパス
      placeholder: docs/architecture/example.md
  - type: textarea
    id: criteria
    attributes:
      label: 完了条件
      placeholder: |
        - [ ] ドキュメントがマージされている
        - [ ] 関連 README / issue-management からリンクされている
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連 Issue / PR
