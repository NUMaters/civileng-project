name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop
      - feat/web-water-flood-ux
    paths:
      - "apps/web/**"
      - "packages/game-data/**"
      - "packages/game-schema/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy web
    runs-on: ubuntu-24.04
    # Repository variable ENABLE_CLOUDFLARE_PAGES=true のときだけ実行
    if: ${{ vars.ENABLE_CLOUDFLARE_PAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          CI: "true"
        run: pnpm --filter @civilcraft/web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy ./dist --project-name=civilcraft
